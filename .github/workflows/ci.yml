name: CI

# Every push and pull request: build, run the tests, package the release artifacts, launch them
# (packaging/smoke-test.sh under a virtual X server), and install the .deb on clean Debian and
# Ubuntu images (packaging/deb-install-test.sh). A run is red when any of that fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plant_fault:
        description: "Control run: drop EmuDOS.dll from the tarball before the smoke test (must go red)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Tools for the smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -q xvfb xauth libarchive-tools

      - name: Template credentials (CI builds are never released)
        run: cp src/EmuDOS.Metadata/Secrets.cs.template src/EmuDOS.Metadata/Secrets.cs

      - name: Build
        run: dotnet build EmuDOS.slnx -c Release

      - name: Test
        run: dotnet test tests/EmuDOS.Tests/EmuDOS.Tests.csproj -c Release --no-build

      - name: Package
        env:
          EMUDOS_ALLOW_TEMPLATE_SECRETS: "1"
        run: packaging/build-release.sh

      - name: Plant a fault (control run)
        if: ${{ inputs.plant_fault }}
        run: |
          rm packaging/out/publish/EmuDOS.dll
          tar -C packaging/out/publish -czf packaging/out/EmuDOS-*-linux-x64.tar.gz .

      - name: Smoke test (launch the tarball and the .deb)
        run: xvfb-run -a packaging/smoke-test.sh packaging/out/EmuDOS-*-linux-x64.tar.gz packaging/out/emudos_*_amd64.deb

      - name: Install the .deb on Debian and Ubuntu
        run: packaging/deb-install-test.sh packaging/out/emudos_*_amd64.deb

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emudos-ci-${{ github.sha }}
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/catalog.db
          retention-days: 7
          if-no-files-found: ignore
